<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Código QR Profesional</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <!-- Librería para generación instantánea de QR con diseño -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body>

<div class="container">
    <h1>Generador de Código QR</h1>

    <!-- Pestañas de Modos -->
    <div class="tabs">
        <button type="button" class="tab-btn active" onclick="cambiarTab('texto')">Texto / URL</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('wifi')">WiFi</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('vcard')">Contacto</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('maps')">Ubicación</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('archivo')">Foto / PDF</button>
    </div>

    <div id="error-box" class="error-msg"></div>

    <form id="qr-form" onsubmit="generarQR(event)" autocomplete="off">
        <input type="hidden" id="modo" value="texto">

        <!-- 1. Texto / URL -->
        <div id="tab-texto" class="tab-content active">
            <div class="input-group">
                <label for="texto_url">Texto o Enlace URL:</label>
                <input type="text" id="texto_url" autocomplete="off" placeholder="https://tu-sitio.com o tu texto aquí">
            </div>
        </div>

        <!-- 2. WiFi -->
        <div id="tab-wifi" class="tab-content">
            <div class="input-group">
                <label for="ssid">Nombre de la red (SSID):</label>
                <input type="text" id="ssid" autocomplete="off" placeholder="Nombre de tu red WiFi">
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" autocomplete="new-password" placeholder="Contraseña de la red">
                    <button type="button" id="togglePassword" class="btn-eye">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="input-group">
                <label for="seguridad">Tipo de Seguridad:</label>
                <select id="seguridad">
                    <option value="WPA">WPA/WPA2/WPA3</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">Sin contraseña (Abierta)</option>
                </select>
            </div>
        </div>

        <!-- 3. Contacto (vCard) -->
        <div id="tab-vcard" class="tab-content">
            <div class="input-group">
                <label for="vcard_nombre">Nombre Completo:</label>
                <input type="text" id="vcard_nombre" placeholder="Ej: Juan Pérez">
            </div>
            <div class="input-group">
                <label for="vcard_tel">Teléfono:</label>
                <input type="tel" id="vcard_tel" placeholder="+56 9 1234 5678">
            </div>
            <div class="input-group">
                <label for="vcard_email">Correo Electrónico:</label>
                <input type="email" id="vcard_email" placeholder="correo@ejemplo.com">
            </div>
            <div class="input-group">
                <label for="vcard_empresa">Empresa / Cargo:</label>
                <input type="text" id="vcard_empresa" placeholder="Ej: Mi Empresa S.A.">
            </div>
        </div>

        <!-- 4. Ubicación (Maps) -->
        <div id="tab-maps" class="tab-content">
            <div class="input-group">
                <label for="maps_url">Enlace o Coordenadas de Google Maps:</label>
                <input type="text" id="maps_url" placeholder="Pegar enlace de Google Maps o Latitud, Longitud">
            </div>
        </div>

        <!-- 5. Archivo (Cloudinary) -->
        <div id="tab-archivo" class="tab-content">
            <div class="input-group">
                <label for="archivo">Seleccionar Foto o PDF:</label>
                <input type="file" id="archivo" accept=".png, .jpg, .jpeg, .gif, .pdf">
            </div>
        </div>

        <!-- Sección Opciones Visuales -->
        <div class="custom-section">
            <label>Personalizar Aspecto del QR:</label>
            <div class="color-pickers">
                <div class="color-item">
                    <label for="color_qr" style="font-size: 12px;">Color QR</label>
                    <input type="color" id="color_qr" value="#000000">
                </div>
                <div class="color-item">
                    <label for="color_fondo" style="font-size: 12px;">Fondo</label>
                    <input type="color" id="color_fondo" value="#ffffff">
                </div>
            </div>
            <div class="input-group" style="margin-top: 10px; margin-bottom: 0;">
                <label for="dots_style" style="font-size: 12px;">Estilo de Puntos:</label>
                <select id="dots_style">
                    <option value="square">Cuadrados Clásicos</option>
                    <option value="dots">Puntos Redondos</option>
                    <option value="rounded">Bordes Suaves</option>
                </select>
            </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary">Generar QR Instantáneo</button>
    </form>

    <!-- Resultado -->
    <div id="qr-result" class="qr-result">
        <h3>Tu Código QR:</h3>
        <div id="qrcode-container"></div>
        <button type="button" class="btn btn-download" onclick="descargarQR()">Descargar Imagen PNG</button>
        <button type="button" class="btn btn-copy" onclick="copiarContenido()">Copiar Enlace/Contenido</button>
    </div>
</div>

<script>
    let qrCode = null;
    let ultimoContenido = "";

    function cambiarTab(modo) {
        document.getElementById('modo').value = modo;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById('tab-' + modo).classList.add('active');
        ocultarError();
    }

    // Alternar ojo en contraseña
    document.getElementById('togglePassword').addEventListener('click', function () {
        const pass = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        const isPass = pass.type === 'password';
        pass.type = isPass ? 'text' : 'password';
        this.style.color = isPass ? '#2563eb' : '#64748b';
    });

    function mostrarError(msg) {
        const box = document.getElementById('error-box');
        box.innerText = msg;
        box.style.display = 'block';
    }

    function ocultarError() {
        document.getElementById('error-box').style.display = 'none';
    }

    async function generarQR(e) {
        e.preventDefault();
        ocultarError();

        const modo = document.getElementById('modo').value;
        let contenido = "";

        if (modo === 'texto') {
            contenido = document.getElementById('texto_url').value.trim();
        } else if (modo === 'wifi') {
            const ssid = document.getElementById('ssid').value.trim();
            const pass = document.getElementById('password').value.trim();
            const seg = document.getElementById('seguridad').value;
            if (!ssid) return mostrarError("Debes ingresar el nombre de la red WiFi.");
            contenido = seg === 'nopass' ? `WIFI:S:${ssid};T:nopass;;` : `WIFI:S:${ssid};T:${seg};P:${pass};;`;
        } else if (modo === 'vcard') {
            const nom = document.getElementById('vcard_nombre').value.trim();
            const tel = document.getElementById('vcard_tel').value.trim();
            const email = document.getElementById('vcard_email').value.trim();
            const emp = document.getElementById('vcard_empresa').value.trim();
            if (!nom) return mostrarError("Ingresa al menos el nombre del contacto.");
            contenido = `BEGIN:VCARD\nVERSION:3.0\nN:${nom}\nFN:${nom}\nTEL:${tel}\nEMAIL:${email}\nORG:${emp}\nEND:VCARD`;
        } else if (modo === 'maps') {
            contenido = document.getElementById('maps_url').value.trim();
            if (!contenido) return mostrarError("Ingresa un enlace o coordenadas de Google Maps.");
        } else if (modo === 'archivo') {
            const fileInput = document.getElementById('archivo');
            if (!fileInput.files.length) return mostrarError("Selecciona una foto o archivo PDF.");

            const formData = new FormData();
            formData.append('archivo', fileInput.files[0]);

            document.getElementById('btn-submit').innerText = "Subiendo archivo...";

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const result = await response.json();
                document.getElementById('btn-submit').innerText = "Generar QR Instantáneo";

                if (!response.ok) return mostrarError(result.error);
                contenido = result.url;
            } catch (err) {
                document.getElementById('btn-submit').innerText = "Generar QR Instantáneo";
                return mostrarError("Error de conexión al subir el archivo.");
            }
        }

        if (!contenido) return mostrarError("Por favor completa los campos requeridos.");

        ultimoContenido = contenido;
        renderizarQR(contenido);
    }

    function renderizarQR(texto) {
        const colorQR = document.getElementById('color_qr').value;
        const colorFondo = document.getElementById('color_fondo').value;
        const dotsStyle = document.getElementById('dots_style').value;

        document.getElementById('qrcode-container').innerHTML = "";

        qrCode = new QRCodeStyling({
            width: 230,
            height: 230,
            type: "canvas",
            data: texto,
            dotsOptions: {
                color: colorQR,
                type: dotsStyle
            },
            backgroundOptions: {
                color: colorFondo,
            }
        });

        qrCode.append(document.getElementById('qrcode-container'));
        document.getElementById('qr-result').style.display = 'block';
    }

    function descargarQR() {
        if (qrCode) {
            qrCode.download({ name: "codigo_qr", extension: "png" });
        }
    }

    function copiarContenido() {
        if (ultimoContenido) {
            navigator.clipboard.writeText(ultimoContenido);
            alert("Contenido/Enlace copiado al portapapeles!");
        }
    }
</script>

</body>
</html>
