<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 96%;
            box-sizing: border-box;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #007bff;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .btn-download {
            background-color: #28a745;
            margin-top: 15px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .qr-result {
            margin-top: 25px;
        }
        .qr-result img {
            max-width: 220px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generador de Código QR</h2>
    <form method="POST">
        <input type="text" name="texto_url" placeholder="Ingresa un texto o URL..." value="{{ original_text }}" required>
        <button type="submit" class="btn btn-submit">Generar QR</button>
    </form>

    {% if qr_code %}
    <div class="qr-result">
        <h3>Tu Código QR:</h3>
        <!-- Muestra la imagen generada -->
        <img src="data:image/png;base64,{{ qr_code }}" alt="Código QR">
        <br>
        <!-- Botón para descargar el código QR -->
        <a href="data:image/png;base64,{{ qr_code }}" download="codigo_qr.png" class="btn btn-download">
            Descargar Código QR
        </a>
    </div>
    {% endif %}
</div>

</body>
</html>
