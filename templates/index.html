<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>QR PRO Web</title>

https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css

<style>

body{
    background:#121212;
    color:white;
}

.card{
    background:#1e1e1e;
}

img{
    max-width:300px;
}

</style>

</head>

<body>

<div class="container mt-5">

<h1 class="mb-4">
📱 QR PRO WEB
</h1>

<div class="card p-4 mb-4">

<h4>Generar QR</h4>

<form method="POST">

<input
type="hidden"
name="accion"
value="texto">

<input
class="form-control"
name="contenido"
placeholder="Texto o URL">

<br>

<button
class="btn btn-success">
Generar QR
</button>

</form>

</div>

<div class="card p-4 mb-4">

<h4>Generar QR WiFi</h4>

<form method="POST">

<input
type="hidden"
name="accion"
value="wifi">

<input
class="form-control"
name="ssid"
placeholder="SSID">

<br>

<input
class="form-control"
name="password"
placeholder="Contraseña">

<br>

<button
class="btn btn-warning">
Generar QR WiFi
</button>

</form>

</div>

{% if qr_generado %}

<div class="card p-4">

<h4>QR Generado</h4>

<img srcenerado }}

</div>

{% endif %}

<hr>

<h3>Historial</h3>

<ul>

{% for item in historial %}

<li>{{ item[0] }}</li>

{% endfor %}

</ul>

</div>

</body>
</html>
