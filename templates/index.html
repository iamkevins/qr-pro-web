<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Código QR Profesional</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <!-- Librería JS: QR Styling -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body>

<div class="container">
    <h1>Generador de Código QR</h1>

    <div class="tabs">
        <button type="button" class="tab-btn active" onclick="cambiarTab('texto')">Texto / URL</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('wifi')">WiFi</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('vcard')">Contacto</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('maps')">Ubicación</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('archivo')">Foto / PDF</button>
    </div>

    <div id="error-box" class="error-msg"></div>

    <form id="qr-form" onsubmit="generarQR(event)" autocomplete="off">
        <input type="hidden" id="modo" value="texto">

        <div id="tab-texto" class="tab-content active">
            <div class="input-group">
                <label for="texto_url">Texto o Enlace URL:</label>
                <input type="text" id="texto_url" autocomplete="off" placeholder="https://tu-sitio.com o tu texto aquí">
            </div>
        </div>

        <div id="tab-wifi" class="tab-content">
            <div class="input-group">
                <label for="ssid">Nombre de la red (SSID):</label>
                <input type="text" id="ssid" autocomplete="off" placeholder="Nombre de tu red WiFi">
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" autocomplete="new-password" placeholder="Contraseña de la red">
                    <button type="button" id="togglePassword" class="btn-eye" aria-label="Mostrar/Ocultar contraseña">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="input-group">
                <label for="seguridad">Tipo de Seguridad:</label>
                <select id="seguridad">
                    <option value="WPA">WPA/WPA2/WPA3</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">Sin contraseña (Abierta)</option>
                </select>
            </div>
        </div>

        <div id="tab-vcard" class="tab-content">
            <div class="input-group">
                <label for="vcard_nombre">Nombre:</label>
                <input type="text" id="vcard_nombre" autocomplete="off" placeholder="Ej: Juan">
            </div>
            <div class="input-group">
                <label for="vcard_apellido">Apellido:</label>
                <input type="text" id="vcard_apellido" autocomplete="off" placeholder="Ej: Pérez">
            </div>
            <div class="input-group">
                <label for="vcard_tel">Teléfono:</label>
                <input type="tel" id="vcard_tel" autocomplete="off" placeholder="+56 9 1234 5678">
            </div>
            <div class="input-group">
                <label for="vcard_email">Correo Electrónico:</label>
                <input type="email" id="vcard_email" autocomplete="off" placeholder="correo@ejemplo.com">
            </div>
            <div class="input-group">
                <label for="vcard_empresa">Empresa / Cargo:</label>
                <input type="text" id="vcard_empresa" autocomplete="off" placeholder="Ej: Mi Empresa S.A.">
            </div>
        </div>

        <div id="tab-maps" class="tab-content">
            <div class="input-group">
                <label for="maps_url">Enlace o Coordenadas de Google Maps:</label>
                <input type="text" id="maps_url" autocomplete="off" placeholder="Pegar enlace de Google Maps o Latitud, Longitud">
            </div>
        </div>

        <div id="tab-archivo" class="tab-content">
            <div class="input-group">
                <label for="archivo">Seleccionar Foto o PDF:</label>
                <input type="file" id="archivo" accept=".png, .jpg, .jpeg, .gif, .pdf">
            </div>
        </div>

        <!-- Personalización Visual Avanzada -->
        <div class="custom-section">
            <label>Personalización Visual Avanzada:</label>
            
            <div class="preset-buttons">
                <button type="button" class="btn-preset" onclick="aplicarPaleta('#000000', '#ffffff')">Clásico</button>
                <button type="button" class="btn-preset" onclick="aplicarPaleta('#1e40af', '#eff6ff')">Azul Tech</button>
                <button type="button" class="btn-preset" onclick="aplicarPaleta('#065f46', '#ecfdf5')">Verde Menta</button>
                <button type="button" class="btn-preset" onclick="aplicarPaleta('#831843', '#fdf2f8')">Elegante</button>
            </div>

            <div class="color-pickers">
                <div class="color-item">
                    <label for="color_qr" style="font-size: 12px;">Color QR</label>
                    <input type="color" id="color_qr" value="#000000">
                </div>
                <div class="color-item">
                    <label for="color_fondo" style="font-size: 12px;">Fondo</label>
                    <input type="color" id="color_fondo" value="#ffffff">
                </div>
            </div>

            <div class="grid-2-col">
                <div class="input-group" style="margin-bottom: 0;">
                    <label for="dots_style" style="font-size: 12px;">Forma de Puntos:</label>
                    <select id="dots_style">
                        <option value="square">Cuadrados</option>
                        <option value="dots">Puntos Redondos</option>
                        <option value="rounded">Bordes Suaves</option>
                    </select>
                </div>
                <div class="input-group" style="margin-bottom: 0;">
                    <label for="corners_style" style="font-size: 12px;">Forma de Ojos:</label>
                    <select id="corners_style">
                        <option value="square">Cuadrado</option>
                        <option value="dot">Circular</option>
                        <option value="extra-rounded">Redondeado</option>
                    </select>
                </div>
            </div>

            <div class="input-group" style="margin-top: 10px; margin-bottom: 0;">
                <label for="logo_file" style="font-size: 12px;">Logo Central (Opcional):</label>
                <input type="file" id="logo_file" accept="image/*" style="font-size: 12px; padding: 6px;">
            </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary">Generar QR Instantáneo</button>
    </form>

    <div id="qr-result" class="qr-result">
        <h3>Tu Código QR:</h3>
        <div id="qrcode-container"></div>
        <button type="button" class="btn btn-download" onclick="descargarQR()">Descargar Imagen PNG</button>
        <button type="button" class="btn btn-copy" onclick="copiarContenido()">Copiar Enlace/Contenido</button>
    </div>
</div>

<script>
    let qrCode = null;
    let ultimoContenido = "";
    let logoDataUrl = "";

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('logo_file').addEventListener('change', procesarLogo);
    });

    function cambiarTab(modo) {
        document.getElementById('modo').value = modo;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById('tab-' + modo).classList.add('active');
        ocultarError();
    }

    function aplicarPaleta(qrColor, bgColor) {
        document.getElementById('color_qr').value = qrColor;
        document.getElementById('color_fondo').value = bgColor;
    }

    function procesarLogo(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) { logoDataUrl = e.target.result; };
            reader.readAsDataURL(file);
        } else {
            logoDataUrl = "";
        }
    }

    document.getElementById('togglePassword').addEventListener('click', function () {
        const pass = document.getElementById('password');
        const isPass = pass.getAttribute('type') === 'password';
        pass.setAttribute('type', isPass ? 'text' : 'password');
        this.style.color = isPass ? "#2563eb" : "#64748b";
    });

    function mostrarError(msg) {
        const box = document.getElementById('error-box');
        box.innerText = msg;
        box.style.display = 'block';
    }

    function ocultarError() {
        document.getElementById('error-box').style.display = 'none';
    }

    async function generarQR(e) {
        e.preventDefault();
        ocultarError();

        const modo = document.getElementById('modo').value;
        let contenido = "";

        if (modo === 'texto') {
            contenido = document.getElementById('texto_url').value.trim();
        } else if (modo === 'wifi') {
            const ssid = document.getElementById('ssid').value.trim();
            const pass = document.getElementById('password').value.trim();
            const seg = document.getElementById('seguridad').value;
            if (!ssid) return mostrarError("Debes ingresar el nombre de la red WiFi.");
            contenido = seg === 'nopass' ? `WIFI:S:${ssid};T:nopass;;` : `WIFI:S:${ssid};T:${seg};P:${pass};;`;
        } else if (modo === 'vcard') {
            const nom = document.getElementById('vcard_nombre').value.trim();
            const ape = document.getElementById('vcard_apellido').value.trim();
            const tel = document.getElementById('vcard_tel').value.trim();
            const email = document.getElementById('vcard_email').value.trim();
            const emp = document.getElementById('vcard_empresa').value.trim();
            if (!nom && !ape) return mostrarError("Ingresa al menos el nombre o el apellido.");
            const nombreCompleto = `${nom} ${ape}`.trim();
            contenido = `BEGIN:VCARD\nVERSION:3.0\nN:${ape};${nom};;;\nFN:${nombreCompleto}\nTEL:${tel}\nEMAIL:${email}\nORG:${emp}\nEND:VCARD`;
        } else if (modo === 'maps') {
            contenido = document.getElementById('maps_url').value.trim();
            if (!contenido) return mostrarError("Ingresa un enlace o coordenadas.");
        } else if (modo === 'archivo') {
            const fileInput = document.getElementById('archivo');
            if (!fileInput.files.length) return mostrarError("Selecciona una foto o PDF.");
            const formData = new FormData();
            formData.append('archivo', fileInput.files[0]);
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = "Subiendo archivo...";

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const result = await response.json();
                btnSubmit.innerText = "Generar QR Instantáneo";
                if (!response.ok) return mostrarError(result.error);
                contenido = result.url;
            } catch (err) {
                btnSubmit.innerText = "Generar QR Instantáneo";
                return mostrarError("Error de conexión al subir archivo.");
            }
        }

        if (!contenido) return mostrarError("Completa los campos requeridos.");

        ultimoContenido = contenido;
        renderizarQR(contenido);
    }

    function renderizarQR(texto) {
        const colorQR = document.getElementById('color_qr').value;
        const colorFondo = document.getElementById('color_fondo').value;
        const dotsStyle = document.getElementById('dots_style').value;
        const cornersStyle = document.getElementById('corners_style').value;

        const dpr = window.devicePixelRatio || 2;
        const baseSize = 250;

        document.getElementById('qrcode-container').innerHTML = "";

        qrCode = new QRCodeStyling({
            width: baseSize * dpr,
            height: baseSize * dpr,
            type: "canvas",
            data: texto,
            image: logoDataUrl || undefined,
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 5,
                imageSize: 0.25
            },
            dotsOptions: {
                color: colorQR,
                type: dotsStyle
            },
            cornersSquareOptions: {
                color: colorQR,
                type: cornersStyle
            },
            backgroundOptions: {
                color: colorFondo,
            }
        });

        qrCode.append(document.getElementById('qrcode-container'));
        document.getElementById('qr-result').style.display = 'block';
    }

    function descargarQR() {
        if (qrCode) {
            qrCode.update({ width: 1000, height: 1000 });
            qrCode.download({ name: "codigo_qr_hd", extension: "png" });
            const dpr = window.devicePixelRatio || 2;
            qrCode.update({ width: 250 * dpr, height: 250 * dpr });
        }
    }

    function copiarContenido() {
        if (ultimoContenido) {
            navigator.clipboard.writeText(ultimoContenido);
            alert("Contenido copiado al portapapeles!");
        }
    }
</script>

</body>
</html>
