<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .qr-result {
            margin-top: 20px;
        }
        .qr-result img {
            max-width: 200px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generador de Código QR</h2>
    <form method="POST">
        <input type="text" name="texto_url" placeholder="Ingresa un texto o URL..." value="{{ original_text }}" required>
        <br>
        <button type="submit">Generar QR</button>
    </form>

    {% if qr_code %}
    <div class="qr-result">
        <h3>Tu Código QR:</h3>
        <img src="data:image/png;base64,{{ qr_code }}" alt="Código QR">
    </div>
    {% endif %}
</div>

</body>
</html>
