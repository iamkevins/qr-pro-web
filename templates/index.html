<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR</title>
    <style>

    </style>
    <link rel="icon" href="https://res.cloudinary.com/qvuwhflg/image/upload/v1789487945/wanopsiwu4vnkpwiihfi.png">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="container">
    <h2>Generador de Código QR</h2>

    <!-- Mensaje de error si falla la subida o la extensión -->
    {% if error_msg %}
    <div class="alert-error">
        {{ error_msg }}
    </div>
    {% endif %}

    <!-- Pestañas principales -->
    <div class="tabs">
        <button type="button" class="tab-btn {% if modo_activo == 'texto' %}active{% endif %}" onclick="cambiarModo('texto')">Texto / URL</button>
        <button type="button" class="tab-btn {% if modo_activo == 'wifi' %}active{% endif %}" onclick="cambiarModo('wifi')">Red WiFi</button>
        <button type="button" class="tab-btn {% if modo_activo == 'archivo' %}active{% endif %}" onclick="cambiarModo('archivo')">Foto / PDF</button>
    </div>

    <!-- Formulario principal -->
    <form method="POST" enctype="multipart/form-data" id="qr-form">
        <input type="hidden" name="modo" id="input-modo" value="{{ modo_activo }}">

        <!-- Sección 1: Texto / URL -->
        <div id="grupo-texto" class="form-group {% if modo_activo == 'texto' %}active{% endif %}">
            <label for="texto_url">Texto o enlace URL:</label>
            <input type="text" autocomplete="off"  id="texto_url" name="texto_url" placeholder="https://ejemplo.com" value="{{ texto_url }}">
        </div>

        <!-- Sección 2: WiFi -->
        <div id="grupo-wifi" class="form-group {% if modo_activo == 'wifi' %}active{% endif %}">
            <label for="ssid">Nombre de la red (SSID):</label>
            <input type="text" id="ssid" name="ssid" autocomplete="off"  placeholder="MiRedWiFi" value="{{ ssid }}">

<!--            <label for="password">Contraseña de WiFi:</label>
            <input type="password" id="password" name="password" placeholder="Contraseña..." value="{{ password }}">
-->
<!-- Campo de contraseña del WiFi con botón de visibilidad -->
<div class="input-group">
    <label for="password">Contraseña:</label>
    <div class="password-wrapper">
        <input type="password" id="password" name="password" value="{{ password if password else '' }}" placeholder="Tu contraseña">
        <button type="button" id="togglePassword" class="btn-eye" aria-label="Mostrar contraseña">
            <!-- Icono de ojo cerrado / abierto (SVG nativo, no requiere librerías externas) -->
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>
</div>







            <label for="seguridad">Tipo de Seguridad:</label>
            <select class="select-edit" id="seguridad" name="seguridad">
                <option value="WPA" {% if seguridad == 'WPA' %}selected{% endif %}>WPA / WPA2 / WPA3</option>
                <option value="WEP" {% if seguridad == 'WEP' %}selected{% endif %}>WEP</option>
                <option value="nopass" {% if seguridad == 'nopass' %}selected{% endif %}>Sin Contraseña</option>
            </select>
        </div>

        <!-- Sección 3: Subida de Foto / PDF -->
        <div id="grupo-archivo" class="form-group {% if modo_activo == 'archivo' %}active{% endif %}">
            <label for="archivo">Selecciona una imagen o PDF:</label>
            <input type="file" id="archivo" name="archivo" accept=".png, .jpg, .jpeg, .gif, .pdf">
            <p class="file-info">Formatos permitidos: PNG, JPG, GIF, PDF.</p>
        </div>

        <button type="submit" class="btn btn-submit">Generar QR</button>
    </form>

    <!-- Visualización y Botón de Descarga -->
    {% if qr_code %}
    <div class="qr-result">
        <h3>Tu Código QR:</h3>
        <img src="data:image/png;base64,{{ qr_code }}" alt="Código QR">

        {% if archivo_url %}
        <p class="file-info">Enlace generado: <a href="{{ archivo_url }}" target="_blank" rel="noopener">Ver archivo guardado</a></p>
        {% endif %}

        <br>
        <a href="data:image/png;base64,{{ qr_code }}" download="codigo_qr.png" class="btn btn-download">
            Descargar Código QR
        </a>
    </div>
    {% endif %}
</div>

<script>
    function cambiarModo(modo) {
        document.getElementById('input-modo').value = modo;

        // Pestañas
        const btns = document.querySelectorAll('.tab-btn');
        btns[0].classList.toggle('active', modo === 'texto');
        btns[1].classList.toggle('active', modo === 'wifi');
        btns[2].classList.toggle('active', modo === 'archivo');

        // Formularios
        document.getElementById('grupo-texto').classList.toggle('active', modo === 'texto');
        document.getElementById('grupo-wifi').classList.toggle('active', modo === 'wifi');
        document.getElementById('grupo-archivo').classList.toggle('active', modo === 'archivo');

        // Validaciones 'required'
        document.getElementById('texto_url').required = (modo === 'texto');
        document.getElementById('ssid').required = (modo === 'wifi');
        document.getElementById('archivo').required = (modo === 'archivo');
    }

    document.addEventListener("DOMContentLoaded", function() {
        cambiarModo("{{ modo_activo }}");
    });
</script>

</body>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const togglePasswordBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener("click", function () {
                // Alternar el tipo de input entre password y text
                const isPassword = passwordInput.getAttribute("type") === "password";
                passwordInput.setAttribute("type", isPassword ? "text" : "password");

                // Cambiar el estilo del icono según el estado
                if (isPassword) {
                    // Ojo abierto (Mostrando contraseña)
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                    togglePasswordBtn.style.color = "#007bff"; // Color activo
                } else {
                    // Ojo tachado (Ocultando contraseña)
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                    togglePasswordBtn.style.color = "#6c757d"; // Color inactivo
                }
            });
        }
    });
</script>

</html>
